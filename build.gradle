plugins {
    id 'java'
    id 'application'
}

group 'by.losik'
version '1.0-SNAPSHOT'

ext {
    gdxVersion = '1.12.1'
    artemisVersion = '2.3.0'
    jomlVersion = '1.10.7'
    lwjglVersion = '3.3.3'
}

repositories {
    mavenCentral()
    google()
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    maven { url "https://jitpack.io" }
}

configurations {
    natives
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"

    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"

    implementation 'com.google.inject:guice:7.0.0'
    implementation 'com.google.inject.extensions:guice-assistedinject:7.0.0'

    implementation 'net.onedaybeard.artemis:artemis-odb:$artemisVersion'
    implementation 'net.onedaybeard.artemis:artemis-fluid-core:$artemisVersion'
    implementation "net.onedaybeard.artemis:artemis-odb:$artemisVersion"
    implementation "net.onedaybeard.artemis:artemis-fluid-core:$artemisVersion"

    implementation "org.joml:joml:$jomlVersion"
    implementation 'it.unimi.dsi:fastutil:8.5.12'

    implementation 'org.apache.commons:commons-collections4:4.4'
    implementation 'org.apache.commons:commons-lang3:3.13.0'
    implementation 'org.apache.commons:commons-math3:3.6.1'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'

    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.11'

    testImplementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testImplementation 'org.awaitility:awaitility:4.2.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'

    // implementation "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
    // implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
    // implementation "com.badlogicgames.gdx:gdx-ai:1.8.2"
    // implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    // implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
}

task copyNatives {
    doLast {
        copy {
            from configurations.natives
            into "$buildDir/natives"
        }
    }
}

classes.dependsOn copyNatives

run {
    dependsOn copyNatives
    systemProperty "java.library.path", "$buildDir/natives"

    jvmArgs = [
        '-Xmx3g',
        '-Xms1g',
        '-XX:+UseG1GC',
        '-XX:+UnlockExperimentalVMOptions',
        '-XX:G1NewSizePercent=20',
        '-XX:G1ReservePercent=20',
        '-XX:MaxGCPauseMillis=50',
        '-XX:G1HeapRegionSize=32M',
        '-Dfile.encoding=UTF-8'
    ]

    systemProperty "artemis.debug", "true"
    systemProperty "artemis.profiler", "true"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.incremental = true
    options.compilerArgs += [
        '-parameters',
        '-Xlint:unchecked',
        '-Xlint:deprecation',
        '-Xdiags:verbose'
    ]

    options.fork = true
    options.forkOptions.jvmArgs += ['-Xmx2g']
}

test {
    useJUnitPlatform()
    maxHeapSize = "4g"
    jvmArgs = [
        '-Xmx4g',
        '-Dfile.encoding=UTF-8',
        '-Djava.awt.headless=true',
        '-Dartemis.skiplogic=true'
    ]

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }

    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
}

application {
    mainClass = 'by.losik.desktop.DesktopLauncher'
}

task generateArtemisFluid(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    //mainClass = 'by.losik.tools.ArtemisFluidGenerator'
    args = ['src/main/java', 'by.losik.components']
}

task checkArchitecture {
    doLast {
        println "Components: ${file('src/main/java/by/losik/components').listFiles().count { it.isDirectory() }} packages"
        println "Systems: TODO - create systems package"
        println "Worlds: TODO - create world initializer"
    }
}

clean {
    delete += file("$buildDir/natives")
}